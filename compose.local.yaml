# Compose de desarrollo local. Sustituye este fichero por compose.yaml solo si se usa Compose fuera de App Service.
services:
  ia:
    build:
      context: ./ai_service
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env before starting}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - app_net
    restart: unless-stopped

  chat:
    build:
      context: ./chat_service
    depends_on:
      ia:
        condition: service_healthy
    environment:
      AI_SERVICE_URL: http://ia:8000
      DATABASE_PATH: /data/chats.db
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?Set FLASK_SECRET_KEY in .env before starting}
    ports:
      - "8080:8080"
    networks:
      - app_net
    volumes:
      - chat_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

networks:
  app_net:

volumes:
  chat_data:
